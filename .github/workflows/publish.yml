name: Publish to npm and MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      - name: Publish to npm (skipped if this version is already on npm)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@smtping/mcp@$V" version >/dev/null 2>&1; then echo "$V already on npm"; else npm publish --provenance --access public; fi
      - name: Publish to MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
